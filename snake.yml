name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *" # une fois par jour
  workflow_dispatch:     # lancement manuel possible depuis l'onglet Actions

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#D362A4&color_dots=#ebedf0,#FFB38A,#FF9A56,#D362A4,#A30262
            dist/snake-dark.svg?palette=github-dark&color_snake=#D362A4&color_dots=#161b22,#5c1a3a,#A30262,#D362A4,#FF9A56

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
